    <script src="script.js" defer></script>

<body>
    <h2>Defina a sua senha</h2>
    <form id="formulario">
        <input type="password" id="senha" placeholder="Digite sua senha aqui"/>

        <ul id="requisitos">
            <li id="req-maiuscula">Possui letra maiuscula</li>
            <li id="req-minuscula">Possui letra minuscula</li>

            <li id="req-especial">Possui caractere especial</li>
            <li id="req-numero">Possui número</li>
        </ul>
    </form>
